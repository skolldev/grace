<div class="flex-1 flex flex-col overflow-hidden">
  <p-table
    [value]="devices()"
    [loading]="loading()"
    scrollHeight="flex"
    [scrollable]="true"
    [paginator]="true"
    [rows]="25"
    [rowsPerPageOptions]="[10, 25, 50, 100]"
    [tableStyle]="{ 'min-width': '50rem' }"
    sortField="last_seen_at"
    [sortOrder]="-1"
  >
    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="hostname">
          Hostname <p-sortIcon field="hostname" />
        </th>
        <th pSortableColumn="os" class="w-32">
          OS <p-sortIcon field="os" />
        </th>
        <th pSortableColumn="arch" class="w-28">
          Arch <p-sortIcon field="arch" />
        </th>
        <th pSortableColumn="ip_address" class="w-40">
          IP Address <p-sortIcon field="ip_address" />
        </th>
        <th pSortableColumn="registered_at" class="w-44">
          Registered <p-sortIcon field="registered_at" />
        </th>
        <th pSortableColumn="last_seen_at" class="w-44">
          Last Seen <p-sortIcon field="last_seen_at" />
        </th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-device>
      <tr>
        <td>{{ device.hostname }}</td>
        <td>
          <p-tag [value]="device.os" />
        </td>
        <td>{{ device.arch }}</td>
        <td>{{ device.ip_address ?? '-' }}</td>
        <td>{{ device.registered_at | date: 'short' }}</td>
        <td>{{ device.last_seen_at | date: 'short' }}</td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="6" class="text-center">No Tarnished have found their way here yet</td>
      </tr>
    </ng-template>
  </p-table>
</div>
