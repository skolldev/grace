name: Erdtree CI

on:
  push:
    branches: [main]
    paths:
      - "erdtree/**"
      - ".github/workflows/erdtree-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "erdtree/**"
      - ".github/workflows/erdtree-ci.yml"

defaults:
  run:
    working-directory: erdtree

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: pytest tests/ -v --cov=server --cov-report=xml --junitxml=junit.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./erdtree/coverage.xml
          flags: erdtree

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./erdtree/junit.xml
          flags: erdtree
          report_type: test_results

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run ruff linting
        run: ruff check server/ tests/

      - name: Run ruff formatting check
        run: ruff format --check server/ tests/
