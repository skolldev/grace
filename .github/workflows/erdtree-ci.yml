name: Erdtree CI

on:
  push:
    branches: [main]
    paths:
      - 'erdtree/**'
      - '.github/workflows/erdtree-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'erdtree/**'
      - '.github/workflows/erdtree-ci.yml'

defaults:
  run:
    working-directory: erdtree

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run ruff linting
        run: ruff check server/ tests/

      - name: Run ruff formatting check
        run: ruff format --check server/ tests/
