name: Tarnished CI

on:
  push:
    branches: [main]
    paths:
      - 'tarnished/**'
      - '.github/workflows/tarnished-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tarnished/**'
      - '.github/workflows/tarnished-ci.yml'

defaults:
  run:
    working-directory: tarnished

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Download dependencies
        run: go mod download

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Run tests (Linux/macOS)
        if: runner.os != 'Windows'
        run: gotestsum --junitfile junit.xml -- -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: gotestsum --junitfile junit.xml -- -v "-coverprofile=coverage.txt" "-covermode=atomic" ./...

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./tarnished/coverage.txt
          flags: tarnished

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./tarnished/junit.xml
          flags: tarnished

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: tarnished
          args: --timeout=5m

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build
        run: make build

      - name: Build all platforms
        run: make build-all
